<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Johnson Rafting Company for reservations, rafting inquiries, trip information, or website feedback.">
    <meta name="author" content="Ogunleye Johnson">

    <title>Contact Us | Johnson Rafting Company</title>

    <link rel="stylesheet" href="styles/rafting.css">


</head>

<body>
    <header>
        <a id="logo_link" href="index.html">
            <img class="logo" src="images/johnson_logo.jpg" alt="Dry Oar Logo">
        </a>
        <nav>
            <a href="index.html">Home</a>

            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div id="feedback">


        </div>

        <div>
            <section class="section1">
                <h1>Johnson Rafting Company</h1>
                <!-- <div class="layer2"> -->

                <div class="layerA">

                    <h2>Address</h2>
                    <p>33, Apo Mechanic street, abuja Nigeria</p>

                    <h2>Mobile Number</h2>
                    <p>+2348064745645</p>

                    <h2>Email</h2>
                    <p>ogunleyejohnson77@gmail.com</p>

                </div>


                <!-- </div> -->


            </section>
            <section class="contact-container">

                <div class="map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d31519.29995408431!2d7.43240542218746!3d9.071736488388066!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1707632708406!5m2!1sen!2sng"
                      width="600" height="450" allowfullscreen="" loading="lazy"
                      referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>

                <div class="contact-form">

                    <form action="#" method="post" class="contact-form">

                        <div class="form-item">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div class="form-item">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-purpose">
                            <label>Purpose of Message</label>

                            <div class="radio-group">

                                <label>
                                    <input type="radio" id="general" name="purpose" value="general">
                                    General Inquiry
                                </label>

                                <label>
                                    <input type="radio" id="reservation" name="purpose"
                                      value="reservation">
                                    Reservation Question
                                </label>

                                <label>
                                    <input type="radio" id="suggestion" name="purpose"
                                      value="suggestion">
                                    Website Suggestion
                                </label>

                            </div>
                        </div>

                        <div class="form-message">
                            <label for="message">Message</label>
                            <textarea id="message" name="message"></textarea>
                        </div>

                        <div class="newsletter">
                            <label>
                                <input type="checkbox" id="newsletter" name="newsletter"
                                  value="yes">

                                Please subscribe me to the monthly newsletter
                            </label>
                        </div>

                        <button type="submit">
                            Send Your Message
                        </button>

                    </form>

                </div>

            </section>
            <section class="employees">

                <h2>Meet Our Team</h2>

                <div class="employee-grid">

                    <figure>
                        <img src="images/employee1.jpg" alt="John Smith - River Guide">
                        <figcaption>John Smith<br>Senior River Guide</figcaption>
                    </figure>

                    <figure>
                        <img src="images/employee2.jpg" alt="Sarah Johnson - Trip Coordinator">
                        <figcaption>Sarah Johnson<br>Trip Coordinator</figcaption>
                    </figure>

                    <figure>
                        <img src="images/employee3.jpg" alt="Michael Brown - Safety Instructor">
                        <figcaption>Michael Brown<br>Safety Instructor</figcaption>
                    </figure>

                </div>

            </section>

        </div>


    </main>
    <footer>
        <div class="copyrightdiv">

            <p>© 2026 Johnson Rafting Company | Ogunleye Johnson</p>


        </div>
        <div class="navdiv">
            <nav class="socialmedia">
                <a href="https://facebook.com">
                    <img src="images/facebook.png" alt="Facebook">
                </a>
                <a href="https://twitter.com">
                    <img src="images/twitter.png" alt="Twitter">
                </a>
                <a href="https://instagram.com">
                    <img src="images/instagram.png" alt="Instagram">
                </a>
            </nav>

        </div>
    </footer>
</body>


</html>
